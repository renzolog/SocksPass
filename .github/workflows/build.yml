name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q SocksPass.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build
        working-directory: SocksPass
        run: |
          bash ./fetch-native.sh
          gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SocksPass-apk
          path: SocksPass/app/build/outputs/apk/release/*.apk
